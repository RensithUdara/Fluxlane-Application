appId: com.fluxlane.app
productName: Fluxlane
copyright: Copyright (c) 2026 Rensith Udara
icon: build/icon.png
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,README.md}'
  - '!docs/**'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: fluxlane
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDownloadsFolderUsageDescription: Fluxlane saves downloaded files to your Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: Rensith Udara
  category: Utility
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: RensithUdara
  repo: Fluxlane-Application
